name: P1 checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  participant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/quietneeds-starter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: docs/quietneeds-starter/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck, build, and production privacy checks
        run: npm run build
        env:
          VITE_APPCHECK_DEBUG: 'true'
          VITE_APPCHECK_DEBUG_TOKEN: CI_SYNTHETIC_DEBUG_TOKEN_MUST_NOT_SHIP
      - run: npm audit --audit-level=high
